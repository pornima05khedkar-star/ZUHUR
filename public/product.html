<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZUHUR | Perfume Details</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="logo">
            ZUHUR
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Perfumes</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>


    <!-- =========================
         PRODUCT DETAILS
    ========================= -->

    <section class="product-details">

        <!-- PRODUCT IMAGE -->

        <div class="product-details-image">

            <img id="productImage"
                 src=""
                 alt="Perfume">

        </div>


        <!-- PRODUCT INFORMATION -->

        <div class="product-details-info">

            <p class="product-category" id="productCategory">
                MEN
            </p>

            <h1 id="productName">
                Perfume
            </h1>

            <p class="product-price" id="productPrice">
                ₹0
            </p>

            <p class="product-size" id="productSize">
                Size: 20 ml
            </p>

            <div class="product-line"></div>


            <!-- DESCRIPTION -->

            <p class="product-long-description" id="productDescription">
                Discover the beautiful fragrance of ZUHUR.
            </p>


            <!-- FRAGRANCE NOTES -->

            <div class="fragrance-notes">

                <h3>
                    Fragrance Notes
                </h3>

                <div class="notes">

                    <div class="note">

                        <span>TOP</span>

                        <p id="topNote">
                            -
                        </p>

                    </div>


                    <div class="note">

                        <span>HEART</span>

                        <p id="heartNote">
                            -
                        </p>

                    </div>


                    <div class="note">

                        <span>BASE</span>

                        <p id="baseNote">
                            -
                        </p>

                    </div>

                </div>

            </div>


            <!-- QUANTITY -->

            <div class="quantity">

                <label for="quantity">
                    Quantity
                </label>

                <select id="quantity">

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="product-buttons">

                <button class="add-cart" id="addToCartBtn">
                    Add to Cart
                </button>

                <button class="buy-now" id="buyNowBtn">
                    Buy Now
                </button>

            </div>


            <!-- BACK -->

            <a href="products.html" class="back-products">
                ← Back to Perfumes
            </a>

        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="logo">
            ZUHUR
        </div>

        <p>
            The Essence of Your Presence.
        </p>

        <p>
            © 2026 ZUHUR. All Rights Reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
