<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZUHUR | Cart</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            ZUHUR
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Perfumes</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>


    <!-- Cart Header -->

    <section class="cart-header">

        <p class="section-title">
            YOUR ZUHUR CART
        </p>

        <h1>
            Shopping Cart
        </h1>

        <p>
            Review your selected fragrances before placing your order.
        </p>

    </section>


    <!-- Cart -->

    <section class="cart-section">

        <div id="cartItems">

            <!-- Products will appear here using JavaScript -->

        </div>


        <!-- Cart Summary -->

        <div class="cart-summary">

            <h2>
                Order Summary
            </h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cartSubtotal">₹0</span>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <span>FREE</span>
            </div>

            <div class="summary-line"></div>

            <div class="summary-total">
                <span>Total</span>
                <span id="cartTotal">₹0</span>
            </div>

            <button id="checkoutBtn" class="checkout-btn">
                Proceed to Checkout
            </button>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <div class="logo">
            ZUHUR
        </div>

        <p>
            The Essence of Your Presence.
        </p>

        <p>
            © 2026 ZUHUR. All Rights Reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
